name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    steps:
      - name: checkout
        uses: actions/checkout@v5

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: test
        run: go test ./...

      - name: configure ssh
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: deploy
        env:
          HOST: ${{ vars.DEPLOY_HOST }}
          USER: ${{ vars.DEPLOY_USER }}
          PATH_ON_SERVER: ${{ vars.DEPLOY_PATH }}
          DOMAIN: ${{ vars.DEPLOY_DOMAIN }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$USER@$HOST" \
            "cd '$PATH_ON_SERVER' && ./scripts/deploy.sh '$GITHUB_SHA'"

          echo "Checking public API readiness..."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 10 \
            "https://$DOMAIN/readyz" \
            >/dev/null

          echo "Staging deployment is healthy."
